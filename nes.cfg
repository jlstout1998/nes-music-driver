# ===================================================================
# NES Linker Configuration for ca65
# ===================================================================
# This file tells the linker how to arrange the ROM in memory

MEMORY {
    # The NES has two banks of 16KB PRG-ROM
    # We'll use 32KB total (expandable later)
    
    # HEADER: INES Cartridge Header
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;

    # PRG-ROM: 32KB at $8000-$FFFF
    PRG0: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    
    # CHR-ROM: 8KB at $0000-$1FFF (PPU space)
    CHR0: start = $0000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00;
    
    # RAM: 2KB at $0000-$07FF (CPU space)
    # Note: RAM is not included in the ROM file
    RAM: start = $0000, size = $0800, type = rw, define = yes;
}

SEGMENTS {
    # PRG-ROM Segments
    HEADER:   load = HEADER, type = ro;
    STARTUP:  load = PRG0, type = ro, start = $8000;
    CODE:     load = PRG0, type = ro, align = $100;
    CODE1:    load = PRG1, type = ro, align = $100;
    RODATA:   load = PRG0, type = ro, align = $100;
    RODATA1:  load = PRG1, type = ro, align = $100;
    VECTORS:  load = PRG1, type = ro, start = $FFFA;
    
    # CHR-ROM Segment
    CHARS:    load = CHR0, type = ro;
    
    # RAM Segments (definitions only - not stored in ROM)
    ZEROPAGE: load = RAM, type = zp, define = yes;
    DRIVERZP: load = RAM, type = zp, start = $D0, define = yes;
    BSS:      load = RAM, type = bss, define = yes;
    DRIVERABS: load = RAM, type = bss, start = $0700, define = yes;
}

FEATURES {
    # Allow the use of .import, .export, etc.
    CONDES: segment = RODATA, type = constructor, label = CONSTRUCTOR, import = __CONSTRUCTOR_TABLE__;
}

SYMBOLS {
    # Export symbols for the debugger
    __STACK_START__: type = export, value = $01FF;

}
